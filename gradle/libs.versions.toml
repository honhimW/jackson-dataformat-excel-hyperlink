junit = "5.14.1"
central-publish = "0.35.0"

[libraries.slf4j]
module = "org.slf4j:slf4j-api"
version.ref = "slf4j"

[libraries.jackson]
module = "com.fasterxml.jackson.core:jackson-databind"
version.ref = "jackson"

[libraries.poi]
module = "org.apache.poi:poi-ooxml"
version.ref = "poi"

[libraries.lombok]
module = "org.projectlombok:lombok"
version.ref = "lombok"

[libraries.junit]
module = "org.junit:junit-bom"
version.ref = "junit"

[plugins.publish]
id = "com.vanniktech.maven.publish"
version.ref = "central-publish"
