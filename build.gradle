import static java.nio.charset.StandardCharsets.UTF_8

plugins {
    id 'java-library'
    alias libs.plugins.publish
    id 'jacoco'
    id 'jacoco-report-aggregation'
}

group = 'io.github.honhimw'
version = libs.versions.version.get()
description = 'Support for reading and writing Excel-Hyperlink via Jackson abstractions.'

def title = 'Jackson Excel-Hyperlink dataformat'

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = UTF_8.name()
//    inputs.files(tasks.withType(ProcessResources))
    options.compilerArgs << '-Werror' << '-Xlint:-options' << '-Xlint:unchecked'
}

java {
    toolchain {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly { extendsFrom annotationProcessor }
    testCompileOnly { extendsFrom testAnnotationProcessor }
}

dependencies {
    api libs.jackson
    api libs.poi
    implementation libs.slf4j

    testImplementation 'com.navercorp.fixturemonkey:fixture-monkey:0.5.0'
    testImplementation 'org.assertj:assertj-core:3.24.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.1'
    testImplementation 'org.apache.commons:commons-lang3:3.12.0'
    testImplementation 'commons-beanutils:commons-beanutils:1.9.4'
    testImplementation "com.fasterxml.jackson.datatype:jackson-datatype-jdk8:$libs.versions.jackson"
    testImplementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:$libs.versions.jackson"
    testImplementation 'org.hibernate.validator:hibernate-validator:6.2.3.Final'
    testImplementation 'javax.validation:validation-api:2.0.1.Final'
    testImplementation 'javax.el:javax.el-api:3.0.0'
    testImplementation 'org.glassfish.web:el-impl:2.2'
    testRuntimeOnly 'ch.qos.logback:logback-classic:1.3.5'
    testImplementation platform(libs.junit)
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-engine'
    testImplementation 'org.junit.platform:junit-platform-launcher'

    annotationProcessor libs.lombok
    testAnnotationProcessor libs.lombok
}

mavenPublishing {
    publishToMavenCentral false
    signAllPublications()
    coordinates(group as String, name, version as String)

    pom {
        packaging = 'jar'
        name = title
        description = project.description
        url = 'https://github.com/honhimW/jackson-dataformat-excel-hyperlink'
        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                distribution = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
            }
        }
        developers {
            developer {
                id = 'honhimw'
                name = 'honhimw'
                url = 'https://honhimW.github.io'
                email = 'honhimw@outlook.com'
            }
        }
        scm {
            url = 'https://github.com/honhimW/jackson-dataformat-excel-hyperlink'
            connection = 'scm:git:git://github.com/honhimW/jackson-dataformat-excel-hyperlink.git'
            developerConnection = 'scm:git:ssh://github.com/honhimW/jackson-dataformat-excel-hyperlink.git'
        }
    }
}

test {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = true
        showStackTraces = true
        exceptionFormat = 'full'
    }
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    reports {
        xml.setRequired true
        csv.setRequired false
        html.setOutputLocation layout.buildDirectory.dir('jacocoHtml')
    }
}
